[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/ssh",
    "crates/vault",
    "crates/inventory",
    "crates/terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net"] }
tracing = "0.1"

[workspace.lints.clippy]
dbg_macro = "warn"
