  <title id="title">Capas de SSHuttle</title>
  <desc id="desc">La interfaz llama a los comandos. El núcleo Rust guarda inventario y secretos, supervisa la sesión SSH y ofrece sondeo, consola, archivos, actualizaciones y pods. El asistente habla con el modelo y con esas capacidades. El servidor se alcanza solo por SSH.</desc>
